plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // id 'com.google.gms.google-services'   // enable together with Firebase below
}

android {
    namespace 'com.socialx.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.socialx.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            def ksFile = file('../socialx-release.keystore')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'socialx2026'
                keyAlias 'socialx'
                keyPassword 'socialx2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('../socialx-release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // ---------------------------------------------------------------------
    // Firebase cloud backend (optional). The complete implementation lives in
    // /firebase/FirebaseRepository.kt and is NOT compiled into this build so
    // that the shipped APK stays light and dexes in a few seconds.
    //
    // To switch the app to the real cloud backend:
    //   1. cp firebase/FirebaseRepository.kt app/src/main/java/com/socialx/app/data/
    //   2. replace app/google-services.json with your own Firebase config
    //   3. uncomment the plugin id and the four lines below
    //   4. set AppConfig.USE_FIREBASE = true and point ServiceLocator at it
    //
    // implementation platform('com.google.firebase:firebase-bom:33.1.2')
    // implementation 'com.google.firebase:firebase-auth-ktx'
    // implementation 'com.google.firebase:firebase-firestore-ktx'
    // implementation 'com.google.firebase:firebase-storage-ktx'
    // ---------------------------------------------------------------------
}
